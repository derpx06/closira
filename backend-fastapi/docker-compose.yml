version: '3.9'
services:
  api:
    build: .
    env_file: .env
    ports:
      - '5001:5001'
    depends_on:
      - mongo
      - qdrant
  mongo:
    image: mongo:7
    ports:
      - '27017:27017'
  qdrant:
    image: qdrant/qdrant:v1.13.2
    ports:
      - '6333:6333'
  redis:
    image: redis:7
    ports:
      - '6379:6379'
